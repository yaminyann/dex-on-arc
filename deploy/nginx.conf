# Serves the built frontend and forwards /api to the api service. Coolify's proxy (Traefik) terminates TLS in front of this.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # nginx drops server-level add_header lines inside any location that sets its own, so each location includes them.
  location = /healthz {
    access_log off;
    include /etc/nginx/security-headers.conf;
    default_type text/plain;
    return 200 "ok";
  }

  # /api/price -> http://api:3001/price (the trailing slash strips the prefix).
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Appends the address nginx saw (Coolify's proxy) to whatever the proxy chain already recorded.
    # Set TRUSTED_PROXY_HOPS=2 on the api service so rate limits use the real client address.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    include /etc/nginx/security-headers.conf;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Single-page app: unknown paths load the app.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
